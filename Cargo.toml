[package]
name = "label-server"
version = "0.1.3"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"

[dependencies]
ab_glyph = "0.2.32"
axum = "0.8.9"
base64 = "0.23.1"
include_dir = "0.7.4"
mime_guess = "2.0.5"
png = "0.18.1"
rusb = { version = "0.9.4", features = ["vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
