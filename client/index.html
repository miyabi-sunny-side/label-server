<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the stored theme before the bundle loads to avoid a flash of
         the wrong theme. Keep the rules in sync with src/lib/theme.ts. -->
    <script>
      try {
        var storedTheme = localStorage.getItem("label-server:theme");
        if (storedTheme === "dark" || storedTheme === "light") {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch (error) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191919" />
    <meta
      name="description"
      content="テキストを打ち込んで印刷ボタンを押すだけで Brother PT-P700 にラベルを印刷する。"
    />
    <title>label-server</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
